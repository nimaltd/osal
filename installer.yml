# Read by stm32-installer. See https://github.com/nimaltd/stm32-installer
#
# There is no version here. The installer reads it from the @version tag in
# osal.h, so the source files are the only place it is written.

name: osal
description: "OS abstraction layer for STM32: the same mutex and delay on bare metal, FreeRTOS and ThreadX"
repository: https://github.com/nimaltd/osal
license: Apache-2.0

# What this library is.
# kind:     driver, middleware, rtos, protocol, filesystem, utility, bsp
# category: sensor, storage, display, communication, wireless, rtos, timing,
#           power, input, math, system
kind: middleware
category: rtos

# Capabilities this library gives other libraries. An RTOS would say [rtos].
provides: []

# What the project has to offer before this library works.
requires:
  installer: 1.9.0    # the first that reads installer.yml
  libraries: []       # other NimaLTD libraries, by name
  hal: true           # HAL_Delay
  cmsis: false
  rtos: optional      # none, CMSIS-RTOS v1 or v2, or ThreadX, set in osal_config.h
  hal_modules: []     # only the core tick is needed, which is always built
  peripherals: []     # no peripheral of its own
  c_standard: c11

# The code keeps its src/ folder in the user's project, just as it sits here.
install:
  layout: mirror

# Headers only, so there is nothing to compile. osal.h stays first: the
# installer reads the version from it. It includes the one port header that
# osal_config.h names, so every port is copied and only one is ever built.
files:
  headers:
    - src/osal.h
    - src/osal_none.h
    - src/osal_cmsis_v1.h
    - src/osal_cmsis_v2.h
    - src/osal_threadx.h
    - src/osal_config.h     # replaced on install, its USER CODE section kept
  sources: []

# Copied as they are, alongside the code.
extras:
  - LICENSE.md
  - NOTICE
  - README.md
  - CHANGELOG.md
